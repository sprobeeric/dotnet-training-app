services:
  postgres:
    image: postgres:17-alpine
    container_name: documenttracker-postgres
    environment:
      POSTGRES_DB: document_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - documenttracker-postgres-data:/var/lib/postgresql/data
      - ./database/docker-init/00-create-test-db.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  documenttracker-postgres-data:
